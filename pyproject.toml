[project]
name = "adaptive-tsfm-selection"
version = "0.1.0"
description = "Adaptive selection of time-series foundation models using interpretable meta-learning"
requires-python = ">=3.11,<3.12"

dependencies = [
    # Shared intersection with Uni2TS 2.0 / GluonTS 0.14.
    "numpy==1.26.4",
    "pandas>=2.1,<2.2",
    "scipy>=1.11.3,<1.12",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    # datasets 2.17 still uses PyExtensionType, removed in PyArrow 21.
    "pyarrow>=17.0,<21",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    # Deep Learning / tsfm
    "torch==2.4.1",
    "chronos-forecasting==2.3.2",
    "uni2ts==2.0.0",
    "timesfm[torch]",
    "transformers>=4.41,<4.50",
    # Proposed interpretable meta-learner and explanations.
    # CPU trees suffice for the router; 3.0 retains SHAP 0.48's model format.
    "xgboost-cpu==3.0.5; sys_platform == 'win32' or sys_platform == 'linux'",
    "xgboost==3.0.5; sys_platform != 'win32' and sys_platform != 'linux'",
    "shap>=0.46,<0.49",
]

[tool.ruff]
line-length = 100

# PyTorch CUDA ------------------------------------
[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
timesfm = { git = "https://github.com/google-research/timesfm.git", rev = "331c6d33cb1ac2611de3056d0ac7164aab6301eb" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
